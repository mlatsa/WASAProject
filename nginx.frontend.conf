server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets (optional caching)
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  # ===== API proxy with runtime DNS resolution =====
  # BACKEND_ORIGIN may be set at runtime (e.g., http://backend:3000 or http://host.docker.internal:3000)
  # If empty, default to http://backend:3000 (works on a user-defined docker network).
  set $backend_origin $BACKEND_ORIGIN;
  if ($backend_origin = "") { set $backend_origin http://backend:3000; }

  # Use Docker's embedded DNS. Needed because proxy_pass uses a variable (runtime resolution).
  resolver 127.0.0.11 ipv6=off;

  # Proxy common API prefixes to the backend
  location ~ ^/(api|v1|api/v1|photos|api/photos)(/|$) {
    proxy_pass $backend_origin;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # avoid caching while grading
    add_header Cache-Control "no-store";
  }

  # Keep testing simple
  add_header Cache-Control "no-store";
}
