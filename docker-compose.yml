version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: cmd/server/Dockerfile
    container_name: backend
    networks: [wasa-net]
    ports: ["8080:8080"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    networks: [wasa-net]
    depends_on: [backend]
    ports: ["8081:80"]

networks:
  wasa-net: {}
